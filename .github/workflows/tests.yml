# PDF盖章工具 - GitHub Actions 持续集成
# 覆盖三条测试线：test_core.py 主套件、unittest discover 全量、GUI smoke
# （Linux 无显示环境用 xvfb-run 提供虚拟显示）。push / pull_request 自动触发。
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Core suite
        run: python test_core.py
      - name: Unit suite (tests/)
        run: python -m unittest discover -s tests -v
      - name: GUI smoke (Windows)
        if: runner.os == 'Windows'
        env:
          PDF_STAMPER_GUI_SMOKE: "1"
        run: python -m unittest tests.test_gui_smoke -v
      - name: GUI smoke (Linux, xvfb)
        if: runner.os == 'Linux'
        env:
          PDF_STAMPER_GUI_SMOKE: "1"
        run: xvfb-run -a python -m unittest tests.test_gui_smoke -v